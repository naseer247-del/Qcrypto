name: Trade
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run Freqtrade
        run: |
          docker run --rm \
            -v $(pwd):/freqtrade/user_data \
            -w /freqtrade \
            -e EXCHANGE_KEY=${{ secrets.EXCHANGE_KEY }} \
            -e EXCHANGE_SECRET=${{ secrets.EXCHANGE_SECRET }} \
            -e TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }} \
            -e TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }} \
            freqtradeorg/freqtrade:latest \
            trade --config /freqtrade/user_data/config.json \
                  --strategy /freqtrade/user_data/strategy.py
