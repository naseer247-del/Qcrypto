name: Trade
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
      - name: Run Freqtrade
        run: |
          docker run --rm \
            -v $(pwd):/freqtrade \
            -w /freqtrade \
            -e EXCHANGE_KEY=${{ secrets.EXCHANGE_KEY }} \
            -e EXCHANGE_SECRET=${{ secrets.EXCHANGE_SECRET }} \
            -e TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }} \
            -e TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }} \
            freqtradeorg/freqtrade:stable \
            trade --config config.json --strategy strategy.py
